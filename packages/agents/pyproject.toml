[project]
name = "mosaera-agents"
version = "0.6.3"
description = "Mosaera agent roles: PM, Coder, Reviewer (prompts + factories, dependency-injected)"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosaera_agents"]
