[project]
name = "mosaera-policies"
version = "0.6.3"
description = "Mosaera governance: deny-by-default tool allowlist and human approval gate"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1.0,<2",
  "langgraph>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosaera_policies"]
