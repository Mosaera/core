[project]
name = "mosaera-connectors"
version = "0.6.3"
description = "Mosaera outbound connectors (GitHub PR flow, ...)"
requires-python = ">=3.11"
# The connectors talk to git purely via subprocess (no gitpython import), and every HTTP call
# uses urllib from the standard library. The one third-party dependency is RS256 signing for
# the GitHub App JWT (ADR-0114) — GitHub mandates RS256, and `cryptography` is already a
# `mosaera-memory` dependency (secrets-at-rest, ADR-0039), so this adds nothing to the lock.
# Preferred over PyJWT: the whole use is ~15 lines and PyJWT would pull `cryptography` anyway.
dependencies = [
  "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mosaera_connectors"]
